name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # On push: find the most recent tag reachable from HEAD.
  # Outputs are empty when no tag exists, which cancels the release build.
  find-release-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            SHA=$(git rev-parse "${TAG}^{commit}")
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "Most recent reachable tag: $TAG ($SHA)"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "No reachable tag found — release build will be skipped."
          fi

  build-android:
    # For push events: only run when find-release-tag found a tag.
    # For pull_request events: always run (find-release-tag is skipped/absent).
    needs: [find-release-tag]
    if: |
      always() &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && needs.find-release-tag.outputs.tag != '')
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For release builds check out the tagged commit, not the tip.
          ref: ${{ github.event_name == 'push' && needs.find-release-tag.outputs.sha || '' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Angular app
        run: yarn build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # --- Debug build (PRs) ---
      - name: Build debug APK
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # --- Release build (push to main) ---
      - name: Decode keystore
        if: github.event_name == 'push'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/pxlpxl-release.keystore

      - name: Create key.properties
        if: github.event_name == 'push'
        run: |
          printf '%s\n' \
            "storeFile=../pxlpxl-release.keystore" \
            "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" \
            "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" \
            "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" \
            > android/key.properties

      - name: Build release AAB
        if: github.event_name == 'push'
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload release AAB
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
