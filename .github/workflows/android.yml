name: Android Build

on:
  # Release builds: triggered only when a tag is explicitly pushed.
  # The checkout will automatically be at the tagged commit.
  push:
    tags: ['*']
  # Debug builds: triggered on PRs targeting main.
  pull_request:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Angular app
        run: yarn build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # --- Debug build (PRs) ---
      - name: Build debug APK
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # --- Release build (push to main) ---
      - name: Decode keystore
        if: github.event_name == 'push'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/pxlpxl-release.keystore

      - name: Create key.properties
        if: github.event_name == 'push'
        run: |
          printf '%s\n' \
            "storeFile=../pxlpxl-release.keystore" \
            "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" \
            "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" \
            "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" \
            > android/key.properties

      - name: Build release AAB
        if: github.event_name == 'push'
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload release AAB
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
