<h2 mat-dialog-title>Edit Swatch Color</h2>

<mat-dialog-content>
  <button
    type="button"
    class="color-swatch-button"
    (click)="openColorPicker()"
    aria-label="Edit color"
  >
    <div class="color-swatch-overlay" [style.background-color]="previewRgba()"></div>
  </button>
</mat-dialog-content>

<mat-dialog-actions>
  <button
    mat-button
    color="warn"
    [disabled]="!canRemove()"
    (click)="onRemove()"
    aria-label="Remove swatch from palette"
  >
    Remove
  </button>
  @if (inUse) {
    <span class="in-use-hint" aria-live="polite">Color is painted on the canvas and cannot be removed</span>
  }
  <span class="spacer"></span>
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button (click)="onConfirm()">Apply</button>
</mat-dialog-actions>
