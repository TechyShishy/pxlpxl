<div class="color-palette panel-touch">
  <div class="active-colors">
    <button
      class="color-preview primary"
      [style.background]="primaryColorRgba()"
      matTooltip="Primary color"
      aria-label="Primary color"
    ></button>
    <button
      mat-icon-button
      matTooltip="Add current primary color to palette"
      (click)="addSwatch()"
      aria-label="Add current primary color to palette"
    >
      <mat-icon>add</mat-icon>
    </button>
    <button
      mat-icon-button
      matTooltip="Remove unused colors"
      (click)="colorService.cleanUnusedColors()"
      aria-label="Remove unused colors"
    >
      <mat-icon>mop</mat-icon>
    </button>
    <button
      mat-icon-button
      matTooltip="Sort palette"
      [matMenuTriggerFor]="sortMenu"
      aria-label="Sort palette"
      aria-haspopup="true"
    >
      <mat-icon>sort</mat-icon>
    </button>
  </div>

  <mat-menu #sortMenu>
    <button mat-menu-item (click)="colorService.sortPaletteByPixelCount()">
      <mat-icon>bar_chart</mat-icon>
      Pixel count (high → low)
    </button>
    <button mat-menu-item (click)="colorService.sortPaletteByDbCode()">
      <mat-icon>format_list_numbered</mat-icon>
      DB code (A → Z)
    </button>
    <button mat-menu-item (click)="colorService.sortPaletteByColor()">
      <mat-icon>palette</mat-icon>
      Color (hue)
    </button>
  </mat-menu>

  <div
    class="swatches"
    role="listbox"
    aria-label="Color palette"
    cdkDropList
    cdkDropListOrientation="mixed"
    (cdkDropListDropped)="onSwatchDrop($event)"
  >
    @for (color of colorService.palette(); track $index) {
      <button
        class="swatch"
        [style.background]="toRgba(color)"
        [class.selected]="isSelected(color)"
        (click)="colorService.setPrimaryColor(color)"
        (pointerdown)="onSwatchPointerDown($event, $index)"
        (pointermove)="onSwatchPointerMove($event)"
        (pointerup)="onSwatchPointerUp()"
        (pointercancel)="onSwatchPointerCancel()"
        (keydown)="onSwatchKeyDown($event, $index)"
        [attr.aria-label]="'Color ' + ($index + 1) + ' — long press or Enter to edit'"
        role="option"
        [attr.aria-selected]="isSelected(color)"
        cdkDrag
        [cdkDragStartDelay]="{ touch: 150, mouse: 0 }"
        (cdkDragStarted)="onSwatchDragStarted()"
      ></button>
    }
  </div>
</div>
