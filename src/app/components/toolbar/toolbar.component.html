<mat-toolbar class="toolbar safe-area-top">
  <button
    mat-icon-button
    matTooltip="Toggle tools"
    (click)="layout.toggleLeftSidebar()"
    aria-label="Toggle tool palette"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <span class="app-title">Pxlpxl</span>
  <span class="title-separator" aria-hidden="true">/</span>
  @if (editingTitle()) {
    <input
      #titleEditInput
      class="project-name-input"
      [formControl]="editControl"
      (keydown.enter)="commitTitleEdit(); $event.stopPropagation()"
      (keydown.escape)="cancelTitleEdit(); $event.stopPropagation()"
      (blur)="commitTitleEdit()"
      aria-label="Rename project"
    />
  } @else {
    <span
      class="project-name"
      aria-label="Project name"
      matTooltip="Long-press to rename"
      (pointerdown)="onTitlePointerDown($event)"
      (pointermove)="onTitlePointerMove($event)"
      (pointerup)="onTitlePointerUp()"
      (pointercancel)="onTitlePointerUp()"
    >{{ projectService.currentProjectName() }}</span>
  }

  <span class="spacer"></span>

  <!-- File menu -->
  <button
    mat-icon-button
    [matMenuTriggerFor]="fileMenu"
    matTooltip="File"
    aria-label="File menu"
  >
    <mat-icon>folder</mat-icon>
  </button>
  <mat-menu #fileMenu="matMenu">
    <button mat-menu-item (click)="onNewProject()">
      <mat-icon>add</mat-icon>
      <span>New Project</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="onLoadProject()">
      <mat-icon>folder_open</mat-icon>
      <span>Open Project</span>
    </button>
    <button mat-menu-item (click)="onImportFile()">
      <mat-icon>upload_file</mat-icon>
      <span>Import File</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="onSaveProject()">
      <mat-icon>save</mat-icon>
      <span>Save</span>
    </button>
    <button mat-menu-item (click)="onExportPxl()">
      <mat-icon>download</mat-icon>
      <span>Export</span>
    </button>
    <button mat-menu-item (click)="onExportProject()">
      <mat-icon>image</mat-icon>
      <span>Export PNG</span>
    </button>
  </mat-menu>

  <!-- Undo / Redo -->
  <button
    mat-icon-button
    [disabled]="!history.canUndo()"
    [matTooltip]="history.canUndo() ? 'Undo: ' + history.undoDescription() : 'Nothing to undo'"
    (click)="history.undo()"
    aria-label="Undo"
  >
    <mat-icon>undo</mat-icon>
  </button>
  <button
    mat-icon-button
    [disabled]="!history.canRedo()"
    [matTooltip]="history.canRedo() ? 'Redo: ' + history.redoDescription() : 'Nothing to redo'"
    (click)="history.redo()"
    aria-label="Redo"
  >
    <mat-icon>redo</mat-icon>
  </button>

  <!-- View controls -->
  <button
    mat-icon-button
    matTooltip="Zoom in"
    (click)="canvasState.zoomIn()"
    aria-label="Zoom in"
  >
    <mat-icon>zoom_in</mat-icon>
  </button>
  <button
    mat-icon-button
    matTooltip="Zoom out"
    (click)="canvasState.zoomOut()"
    aria-label="Zoom out"
  >
    <mat-icon>zoom_out</mat-icon>
  </button>
  <button
    mat-icon-button
    matTooltip="Toggle grid"
    (click)="canvasState.toggleGrid()"
    aria-label="Toggle pixel grid"
  >
    <mat-icon>grid_on</mat-icon>
  </button>

  <button
    mat-icon-button
    matTooltip="Toggle panels"
    (click)="layout.toggleRightSidebar()"
    aria-label="Toggle panels"
  >
    <mat-icon>dashboard</mat-icon>
  </button>
</mat-toolbar>
