<div class="layers-panel panel-touch">
  <div class="layers-header">
    <span class="layers-title">Layers</span>
    <button
      mat-icon-button
      matTooltip="Add layer"
      (click)="addLayer()"
      aria-label="Add new layer"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <div
    class="layers-list"
    role="listbox"
    aria-label="Layers"
    cdkDropList
    (cdkDropListDropped)="drop($event)"
  >
    @for (layer of layerService.layers(); track layer.id; let i = $index) {
      <div
        class="layer-item"
        [class.active]="i === layerService.activeLayerIndex()"
        (click)="onSelect(i)"
        (pointerdown)="onPointerDown($event, layer)"
        (pointermove)="onPointerMove($event)"
        (pointerup)="onPointerUp()"
        (pointercancel)="onPointerUp()"
        (keydown.enter)="onEnterKey($event, layer)"
        (keydown)="onLayerKeydown($event, i)"
        cdkDrag
        role="option"
        [attr.aria-selected]="i === layerService.activeLayerIndex()"
        [attr.aria-label]="layer.name"
      >
        <button
          mat-icon-button
          cdkDragHandle
          matTooltip="Drag to reorder"
          aria-label="Drag to reorder"
          class="drag-handle"
          (click)="$event.stopPropagation()"
        >
          <mat-icon>drag_indicator</mat-icon>
        </button>

        @if (editingLayerId() === layer.id) {
          <input
            #editInput
            class="edit-input"
            [formControl]="editControl"
            (keydown.enter)="commitEdit(layer, i); $event.stopPropagation()"
            (keydown.escape)="cancelEdit(); $event.stopPropagation()"
            (blur)="commitEdit(layer, i)"
            [attr.aria-label]="'Rename ' + layer.name"
          />
        } @else {
          <span class="layer-name">{{ layer.name }}</span>
        }

        <button
          mat-icon-button
          class="layer-menu-trigger"
          [matMenuTriggerFor]="layerMenu"
          [attr.aria-label]="'Layer options for ' + layer.name"
          matTooltip="Layer options"
          (click)="$event.stopPropagation()"
        >
          <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #layerMenu="matMenu">
          <button
            mat-menu-item
            (click)="layerService.toggleVisibility(i)"
          >
            <mat-icon>{{ layer.visible ? 'visibility_off' : 'visibility' }}</mat-icon>
            {{ layer.visible ? 'Hide layer' : 'Show layer' }}
          </button>
          <button
            mat-menu-item
            (click)="startEdit(layer)"
          >
            <mat-icon>edit</mat-icon>
            Rename layer
          </button>
          <button
            mat-menu-item
            (click)="duplicateLayer(i)"
          >
            <mat-icon>content_copy</mat-icon>
            Duplicate layer
          </button>
          <button
            mat-menu-item
            [disabled]="i <= 0"
            (click)="flattenToAbove(i)"
          >
            <mat-icon>merge</mat-icon>
            Flatten to above
          </button>
          <button
            mat-menu-item
            [disabled]="layerService.layerCount() <= 1"
            (click)="layerService.removeLayer(i)"
          >
            <mat-icon>delete</mat-icon>
            Delete layer
          </button>
        </mat-menu>
      </div>

      <div class="layer-opacity">
        <mat-icon class="opacity-icon">opacity</mat-icon>
        <mat-slider [min]="0" [max]="100" [step]="1" class="opacity-slider">
          <input
            matSliderThumb
            [value]="layer.opacity * 100"
            (valueChange)="layerService.setOpacity(i, $event / 100)"
            [attr.aria-label]="layer.name + ' opacity'"
          />
        </mat-slider>
      </div>
    }
  </div>
</div>
