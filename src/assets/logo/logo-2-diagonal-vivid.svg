<!-- logo-2-diagonal-vivid.svg
     Background : 135° linear gradient #6C25E3 → #1A0040
     Typography : bold geometric sans-serif
     Echo offset: +80px right, +80px down (noticeable displacement)
     Primary    : #FFFFFF
     Echo       : #00e5ff at opacity 0.60 (cyan accent)
     To regenerate PNG: inkscape --export-type=png --export-width=512 logo-2-diagonal-vivid.svg -o logo-2-diagonal-vivid.png
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8B3FFF"/>
      <stop offset="50%"  stop-color="#6C25E3"/>
      <stop offset="100%" stop-color="#1A0040"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg2)"/>

  <!-- Echo (rendered first, behind primary) -->
  <text
    x="165" y="520"
    font-family="'Futura', 'Nunito', 'Montserrat', 'Arial Black', sans-serif"
    font-size="300"
    font-weight="900"
    letter-spacing="-8"
    fill="#00e5ff"
    opacity="0.60"
  >PXL</text>

  <!-- Primary -->
  <text
    x="85" y="440"
    font-family="'Futura', 'Nunito', 'Montserrat', 'Arial Black', sans-serif"
    font-size="300"
    font-weight="900"
    letter-spacing="-8"
    fill="#FFFFFF"
  >PXL</text>
</svg>
