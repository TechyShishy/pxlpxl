<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- logo-9-echo-orange.svg
     Base    : logo-7 (layout, gradient, typography, offset all identical)
     Echo    : #FFB347 (warm orange) at opacity 0.80
     Primary : #FFFFFF
-->

<svg
   viewBox="0 0 1024 1024"
   width="1024"
   height="1024"
   version="1.1"
   id="svg7"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs6">
    <linearGradient
       id="bg9"
       x1="0"
       y1="0"
       x2="1024"
       y2="1024"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#9B59FF"
         id="stop1" />
      <stop
         offset="30%"
         stop-color="#8B3FFF"
         id="stop2" />
      <stop
         offset="38%"
         stop-color="#6C25E3"
         id="stop3" />
      <stop
         offset="52%"
         stop-color="#3A0090"
         id="stop4" />
      <stop
         offset="65%"
         stop-color="#1A0040"
         id="stop5" />
      <stop
         offset="100%"
         stop-color="#0A0020"
         id="stop6" />
    </linearGradient>
  </defs>
  <rect
     width="1024"
     height="1024"
     fill="url(#bg9)"
     id="rect6"
     x="0"
     y="0"
     style="fill:url(#bg9)" />
  <!-- Echo -->
  <text
     x="255"
     y="680"
     font-family="Futura, Nunito, Montserrat, 'Arial Black', sans-serif"
     font-size="300px"
     font-weight="900"
     letter-spacing="-8"
     fill="#ffb347"
     opacity="0.8"
     id="text6">PXL</text>
  <!-- Primary -->
  <text
     x="85"
     y="440"
     font-family="Futura, Nunito, Montserrat, 'Arial Black', sans-serif"
     font-size="300px"
     font-weight="900"
     letter-spacing="-8"
     fill="#ffffff"
     id="text7">PXL</text>
</svg>
